<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#03040a"><title>Super Cérebro</title><link rel="stylesheet" href="./style.css"><style>
.real-brain-wrap{position:relative;z-index:10;width:min(96vw,1100px);height:min(76vh,760px);display:grid;place-items:center;pointer-events:none;filter:drop-shadow(0 0 28px rgba(244,114,182,.28)) drop-shadow(0 0 55px rgba(139,92,246,.18));animation:realBrainPulse 3.2s ease-in-out infinite}.real-brain{display:block;width:100%;height:100%;object-fit:contain;object-position:center;mix-blend-mode:screen;filter:saturate(1.08) brightness(.96) drop-shadow(0 0 22px rgba(244,114,182,.32));user-select:none;-webkit-user-drag:none}.real-brain-wrap:after{content:"";position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle,rgba(244,114,182,.13),rgba(139,92,246,.08) 42%,transparent 70%);filter:blur(25px);z-index:-1}@keyframes realBrainPulse{0%,100%{transform:scale(.97)}50%{transform:scale(1.035)}}.chat-mode .real-brain-wrap{width:min(105vw,1180px)!important;height:min(82vh,820px)!important;animation-duration:2.5s;opacity:.72}@media(max-width:700px){.real-brain-wrap{width:118vw;height:70vh}.chat-mode .real-brain-wrap{width:125vw!important;height:76vh!important;opacity:.62}}
.composer-tools{display:flex;gap:7px;align-items:center;margin:0 auto 7px;width:min(100%,1100px);padding:0 3px}.tool-btn{width:38px;height:34px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(10,15,27,.82);color:#cbd5e1;cursor:pointer;display:grid;place-items:center;font-size:15px;transition:.2s}.tool-btn:hover{border-color:rgba(139,92,246,.6);color:#fff;transform:translateY(-1px)}.tool-btn.active{background:rgba(139,92,246,.25);border-color:rgba(139,92,246,.7);box-shadow:0 0 18px rgba(139,92,246,.2)}.attachment-preview{display:none;width:min(100%,1100px);margin:0 auto 7px;padding:9px 12px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(9,13,24,.9);color:#aeb9cc;font-size:12px;align-items:center;justify-content:space-between;gap:10px}.attachment-preview.show{display:flex}.attachment-preview img{width:38px;height:38px;object-fit:cover;border-radius:9px}.remove-attachment{border:0;background:transparent;color:#fda4af;font-size:18px;cursor:pointer}#fileInput{display:none}.recording-dot{width:7px;height:7px;border-radius:50%;background:#fb7185;box-shadow:0 0 12px #fb7185;animation:recPulse .7s infinite alternate}@keyframes recPulse{to{transform:scale(1.7);opacity:.55}}
</style></head><body><div class="app-shell"><header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true"><span></span></div><div><h1>Super Cérebro</h1><span><i class="status-dot"></i> Vireonix conectado</span></div></div><button id="newChat" class="icon-button" title="Nova conversa" aria-label="Nova conversa">＋</button></header><main id="chat" class="chat" aria-live="polite"><section id="brainStage" class="brain-stage" aria-label="Cérebro do Super Cérebro"><div class="cyber-brain" aria-hidden="true"><div class="brain-halo"></div><div class="real-brain-wrap"><img class="real-brain" src="https://images.rawpixel.com/dark_image_png_800/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDI2LTAyL3NyLWltYWdlLTI2MDEyNi1zaS0xNS1zLTQ0OC1tbDZucDVyeS5wbmc.png" alt="Cérebro humano 3D rosa"></div><div class="scan-ring ring1"></div><div class="scan-ring ring2"></div></div><canvas id="brainCanvas" aria-hidden="true"></canvas><div class="brain-aura"></div><div class="brain-state" id="brainState">Pronto para pensar</div></section><section id="welcome" class="welcome"><h2>Como posso ajudar?</h2><p>Escreva, fale ou envie uma imagem/áudio. O cérebro reage enquanto pensa e responde.</p><div class="quick-actions"><button data-prompt="Explique como você organiza uma tarefa complexa.">🧠 Explicar</button><button data-prompt="Pesquise e compare informações sobre inteligência artificial.">🔎 Pesquisar</button><button data-prompt="Ajude-me a criar um plano passo a passo para um projeto.">⚙️ Planejar</button><button data-prompt="Faça um diagnóstico da sua capacidade local de ferramentas.">🩺 Diagnóstico</button></div></section></main><footer class="composer-wrap"><div id="attachmentPreview" class="attachment-preview"><span id="attachmentInfo"></span><button id="removeAttachment" class="remove-attachment" aria-label="Remover anexo">×</button></div><div class="composer-tools" aria-label="Ferramentas da conversa"><button id="attachImage" class="tool-btn" title="Enviar imagem" aria-label="Enviar imagem">▧</button><button id="recordAudio" class="tool-btn" title="Gravar áudio" aria-label="Gravar áudio">●</button><button id="insertText" class="tool-btn" title="Inserir texto" aria-label="Inserir texto">T</button><button id="clearComposer" class="tool-btn" title="Limpar campo" aria-label="Limpar campo">⌫</button></div><input id="fileInput" type="file" accept="image/*"><div class="composer"><button id="voice" class="voice-button" aria-label="Falar com o Super Cérebro" title="Falar">🎙</button><textarea id="message" rows="1" maxlength="20000" placeholder="Mensagem para o Super Cérebro..." aria-label="Mensagem"></textarea><button id="send" class="send-button" aria-label="Enviar">➤</button></div><div class="composer-meta"><span id="typing"></span><span>Vireonix • memória • ferramentas • pesquisa</span></div></footer></div><script src="./app.js"></script><script>
(()=>{const file=document.getElementById('fileInput'),attach=document.getElementById('attachImage'),preview=document.getElementById('attachmentPreview'),info=document.getElementById('attachmentInfo'),remove=document.getElementById('removeAttachment'),record=document.getElementById('recordAudio'),text=document.getElementById('insertText'),clear=document.getElementById('clearComposer'),msg=document.getElementById('message');let recorder=null,chunks=[];
attach.onclick=()=>file.click();file.onchange=()=>{const f=file.files?.[0];if(!f)return;info.textContent='🖼️ '+f.name+' • '+Math.round(f.size/1024)+' KB';preview.classList.add('show');};remove.onclick=()=>{file.value='';preview.classList.remove('show');info.textContent=''};text.onclick=()=>{msg.focus();msg.setSelectionRange(msg.value.length,msg.value.length)};clear.onclick=()=>{msg.value='';msg.style.height='48px';msg.focus()};
record.onclick=async()=>{if(recorder&&recorder.state==='recording'){recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia){alert('Seu navegador não permite gravação de áudio.');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstart=()=>{record.classList.add('active');record.innerHTML='<span class="recording-dot"></span>';document.getElementById('brainStage').classList.add('listening')};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());record.classList.remove('active');record.textContent='●';document.getElementById('brainStage').classList.remove('listening');const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});const url=URL.createObjectURL(blob);info.innerHTML='🎧 Áudio gravado <audio controls src="'+url+'"></audio>';preview.classList.add('show')};recorder.start()}catch(e){alert('Não foi possível acessar o microfone.')}};
})();</script></body></html>
