<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070d">
  <title>Super Cérebro</title>
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brain-mini" aria-hidden="true">🧠</div>
        <div>
          <h1>Super Cérebro</h1>
          <span><i class="status-dot"></i> Vireonix conectado</span>
        </div>
      </div>
      <button id="newChat" class="icon-button" title="Nova conversa" aria-label="Nova conversa">＋</button>
    </header>

    <main id="chat" class="chat" aria-live="polite">
      <section id="brainStage" class="brain-stage" aria-label="Cérebro interativo">
        <div class="brain-halo"></div>
        <div class="brain-core">
          <div class="brain-glow"></div>
          <div class="brain-shape" aria-hidden="true">🧠</div>
          <div class="brain-pulse p1"></div><div class="brain-pulse p2"></div><div class="brain-pulse p3"></div>
        </div>
        <div class="brain-state" id="brainState">Pronto para pensar</div>
      </section>

      <section id="welcome" class="welcome">
        <h2>Como posso ajudar?</h2>
        <p>Fale ou escreva. O cérebro reage à conversa e o chat ocupa toda a tela.</p>
        <div class="quick-actions">
          <button data-prompt="Explique como você organiza uma tarefa complexa.">🧠 Explicar</button>
          <button data-prompt="Pesquise e compare informações sobre inteligência artificial.">🔎 Pesquisar</button>
          <button data-prompt="Ajude-me a criar um plano passo a passo para um projeto.">⚙️ Planejar</button>
          <button data-prompt="Faça um diagnóstico da sua capacidade local de ferramentas.">🩺 Diagnóstico</button>
        </div>
      </section>
    </main>

    <footer class="composer-wrap">
      <div class="composer">
        <button id="voice" class="voice-button" aria-label="Falar com o Super Cérebro" title="Falar">🎙️</button>
        <textarea id="message" rows="1" maxlength="20000" placeholder="Mensagem para o Super Cérebro..." aria-label="Mensagem"></textarea>
        <button id="send" class="send-button" aria-label="Enviar">➤</button>
      </div>
      <div class="composer-meta">
        <span id="typing"></span>
        <span>Vireonix • memória • ferramentas • pesquisa</span>
      </div>
    </footer>
  </div>
  <script src="/web/app.js"></script>
</body>
</html>
