<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020308"><title>Super Cérebro • Vireonix</title><link rel="stylesheet" href="./style.css"><style>
.robot-stage{position:absolute;inset:0;overflow:hidden;display:grid;place-items:center;background:#020308}.robot-wrap{position:absolute;inset:0;width:100%;height:100%;display:grid;place-items:center;z-index:8;overflow:hidden;animation:robotLife 8s ease-in-out infinite;will-change:transform,filter}.robot-img{width:100%;height:100%;object-fit:cover;object-position:center center;user-select:none;-webkit-user-drag:none;display:block;mix-blend-mode:normal;filter:saturate(1.05) contrast(1.06) brightness(.86);transform:scale(1.035);animation:robotBreath 7s ease-in-out infinite;will-change:transform,filter}.robot-wrap:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 34%,rgba(0,0,0,.16) 66%,rgba(0,0,0,.62) 100%),linear-gradient(180deg,rgba(1,3,8,.22),transparent 32%,transparent 70%,rgba(1,3,8,.58));pointer-events:none}.robot-glow{position:absolute;width:52%;height:48%;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.14),rgba(139,92,246,.08) 42%,transparent 72%);filter:blur(45px);z-index:2;animation:robotAura 3.8s ease-in-out infinite;pointer-events:none}.robot-grid{position:absolute;inset:12%;border:1px solid rgba(34,211,238,.04);border-radius:50%;animation:gridSpin 22s linear infinite;pointer-events:none;z-index:3}.robot-grid:after{content:"";position:absolute;inset:14%;border:1px dashed rgba(139,92,246,.05);border-radius:50%}.robot-status{position:absolute;bottom:9%;z-index:25;padding:8px 16px;border:1px solid rgba(34,211,238,.28);border-radius:999px;background:rgba(3,5,11,.6);backdrop-filter:blur(16px);color:#dff5ff;font-size:11px;box-shadow:0 8px 30px rgba(0,0,0,.45);letter-spacing:.2px}.brain-stage.thinking .robot-wrap{animation:robotThink .72s ease-in-out infinite!important;filter:drop-shadow(0 0 34px rgba(139,92,246,.32))}.brain-stage.thinking .robot-img{animation:robotThinkImage .72s ease-in-out infinite!important;filter:saturate(1.12) contrast(1.1) brightness(.9)}.brain-stage.listening .robot-wrap{animation:robotListen 1.1s ease-in-out infinite!important;filter:drop-shadow(0 0 38px rgba(34,211,238,.38))}.brain-stage.listening .robot-img{animation:robotListenImage 1.1s ease-in-out infinite!important}.brain-stage.speaking .robot-wrap{animation:robotSpeak .3s ease-in-out infinite!important;filter:drop-shadow(0 0 44px rgba(244,114,182,.4))}.brain-stage.speaking .robot-img{animation:robotSpeakImage .3s ease-in-out infinite!important}.chat-mode .robot-wrap{inset:0;height:100%;width:100%;opacity:1}.chat-mode .robot-img{object-position:center center}.chat-mode .robot-status{bottom:16px}@keyframes robotLife{0%,100%{transform:scale(1)}50%{transform:scale(1.008)}}@keyframes robotBreath{0%,100%{transform:scale(1.035) translate3d(0,0,0)}50%{transform:scale(1.065) translate3d(0,-3px,0)}}@keyframes robotThink{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.015) translateY(-4px)}}@keyframes robotThinkImage{0%,100%{transform:scale(1.035)}50%{transform:scale(1.055) translateY(-4px)}}@keyframes robotListen{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}@keyframes robotListenImage{0%,100%{transform:scale(1.045)}50%{transform:scale(1.075)}}@keyframes robotSpeak{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}@keyframes robotSpeakImage{0%,100%{transform:scale(1.05)}50%{transform:scale(1.09)}}@keyframes robotAura{0%,100%{transform:scale(.82);opacity:.35}50%{transform:scale(1.18);opacity:.9}}@keyframes gridSpin{to{transform:rotate(360deg)}}@media(max-width:700px){.robot-img{object-position:center center;transform:scale(1.08)}.robot-wrap{inset:-1%}.robot-status{bottom:7%}}
</style></head><body><div class="app-shell"><header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true"><span>✦</span></div><div><h1>Super Cérebro</h1><span><i class="status-dot"></i> Vireonix conectado</span></div></div><div class="top-actions"><button id="memoryButton" class="icon-button" title="Memória — conversas salvas" aria-label="Abrir memória">▣</button><button id="voiceTest" class="icon-button" title="Testar voz masculina" aria-label="Testar voz masculina">🔊</button><button id="newChat" class="icon-button" title="Nova conversa" aria-label="Nova conversa">＋</button></div></header><aside id="memoryPanel" class="memory-panel" aria-label="Memória de conversas"><div class="memory-head"><div><strong>Memória</strong><span>Suas conversas salvas neste dispositivo</span></div><button id="memoryClose" class="icon-button" aria-label="Fechar memória">×</button></div><div id="memoryList" class="memory-list"></div></aside><div id="voiceStatus" class="voice-status"></div><main id="chat" class="chat" aria-live="polite"><section id="brainStage" class="brain-stage" aria-label="Avatar humanoide do Super Cérebro"><div class="robot-stage"><div class="robot-wrap"><div class="robot-glow"></div><div class="robot-grid"></div><img class="robot-img" src="https://vegas411.com/upload/media/entries/2025-11/04/7022-entry-0-1762325823.jpg" alt="Humanoide futurista do Super Cérebro"><div class="robot-status" id="brainState">Pronto para conversar</div></div></div><canvas id="brainCanvas" aria-hidden="true"></canvas><div class="brain-aura"></div></section><section id="welcome" class="welcome"><h2>O que vamos fazer?</h2><p>Converse com o Vireonix. Escreva, fale ou use as ferramentas abaixo.</p><div class="quick-actions"><button data-prompt="Explique como você organiza uma tarefa complexa.">🧠 Explicar</button><button data-prompt="Pesquise e compare informações sobre inteligência artificial.">🔎 Pesquisar</button><button data-prompt="Ajude-me a criar um plano passo a passo para um projeto.">⚙️ Planejar</button><button data-prompt="Analise este problema e apresente as melhores alternativas.">📊 Analisar</button></div></section></main><footer class="composer-wrap"><div id="attachmentPreview" class="attachment-preview"><span id="attachmentInfo"></span><button id="removeAttachment" class="remove-attachment" aria-label="Remover anexo">×</button></div><div class="composer-tools" aria-label="Ferramentas"><button id="attachImage" class="tool-btn" title="Enviar imagem" aria-label="Enviar imagem">▧</button><button id="recordAudio" class="tool-btn" title="Gravar áudio" aria-label="Gravar áudio">●</button><button id="insertText" class="tool-btn" title="Focar texto" aria-label="Focar texto">T</button><button id="clearComposer" class="tool-btn" title="Limpar" aria-label="Limpar">⌫</button></div><input id="fileInput" type="file" accept="image/*"><div class="composer"><button id="voice" class="voice-button" aria-label="Falar com o Super Cérebro" title="Falar">🎙</button><textarea id="message" rows="1" maxlength="20000" placeholder="Converse com o Super Cérebro..." aria-label="Mensagem"></textarea><button id="send" class="send-button" aria-label="Enviar">➤</button></div><div class="composer-meta"><span id="typing"></span><span>Vireonix • memória • ferramentas • pesquisa</span></div></footer></div><script src="./cognitive.js?v=20260918-23"></script><script src="./app.js?v=20260918-23"></script><script src="./voice.js?v=20260918-23"></script><script src="./robot.js?v=20260918-23"></script><script>
(()=>{const file=document.getElementById('fileInput'),attach=document.getElementById('attachImage'),preview=document.getElementById('attachmentPreview'),info=document.getElementById('attachmentInfo'),remove=document.getElementById('removeAttachment'),record=document.getElementById('recordAudio'),text=document.getElementById('insertText'),clear=document.getElementById('clearComposer'),msg=document.getElementById('message');let recorder=null,chunks=[];attach.onclick=()=>file.click();remove.onclick=()=>window.clearSelectedImage?.();text.onclick=()=>{msg.focus();msg.setSelectionRange(msg.value.length,msg.value.length)};clear.onclick=()=>{msg.value='';msg.style.height='48px';msg.focus()};record.onclick=async()=>{if(recorder&&recorder.state==='recording'){recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia){alert('Seu navegador não permite gravação de áudio.');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstart=()=>{record.classList.add('active');record.innerHTML='<span class="recording-dot"></span>';document.getElementById('brainStage').classList.add('listening')};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());record.classList.remove('active');record.textContent='●';const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});const url=URL.createObjectURL(blob);info.innerHTML='🎧 Áudio gravado <audio controls src="'+url+'"></audio>';preview.classList.add('show')};recorder.start()}catch(e){alert('Não foi possível acessar o microfone.')}}})();
</script><script>document.getElementById("memoryButton")?.addEventListener("click",()=>window.openMemory?.());document.getElementById("memoryClose")?.addEventListener("click",()=>document.getElementById("memoryPanel")?.classList.remove("open"));document.getElementById("voiceTest")?.addEventListener("click",()=>window.testMaleVoice?.());</script></body></html>
