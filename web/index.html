<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020308"><title>Super Cérebro • Vireonix</title><link rel="stylesheet" href="./style.css"><style>.robot-stage{position:absolute;inset:0;overflow:hidden;background:#020308}.robot-wrap{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;border:0;border-radius:0;background:#020308}.robot-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;transform:scale(1.04);filter:saturate(1.05) contrast(1.04) brightness(.92);transition:filter .35s,transform .35s}.robot-wrap:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.16) 76%,rgba(0,0,0,.48) 100%)}.robot-status{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);z-index:25;padding:7px 14px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(2,5,10,.48);color:#eaf6ff;font-size:11px;backdrop-filter:blur(12px);white-space:nowrap}.brain-stage.thinking .robot-video{transform:scale(1.07);filter:saturate(1.12) contrast(1.08) brightness(.98)}.brain-stage.listening .robot-video{transform:scale(1.06);filter:saturate(1.16) contrast(1.08) brightness(1.02)}.brain-stage.speaking .robot-video{transform:scale(1.065);filter:saturate(1.2) contrast(1.1) brightness(1.04)}@media(max-width:700px){.robot-video{transform:scale(1.08)}.robot-status{bottom:10px;font-size:10px}}</style></head><body><div class="app-shell"><header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true"><span>✦</span></div><div><h1>Super Cérebro</h1><span><i class="status-dot"></i> Vireonix conectado</span></div></div><div class="top-actions"><button id="memoryButton" class="icon-button" title="Memória — conversas salvas" aria-label="Abrir memória">▣</button><button id="voiceTest" class="icon-button" title="Testar voz masculina" aria-label="Testar voz masculina">🔊</button><button id="newChat" class="icon-button" title="Nova conversa" aria-label="Nova conversa">＋</button></div></header><aside id="memoryPanel" class="memory-panel" aria-label="Memória de conversas"><div class="memory-head"><div><strong>Memória</strong><span>Suas conversas salvas neste dispositivo</span></div><button id="memoryClose" class="icon-button" aria-label="Fechar memória">×</button></div><div id="memoryList" class="memory-list"></div></aside><div id="voiceStatus" class="voice-status"></div><main id="chat" class="chat" aria-live="polite"><section id="brainStage" class="brain-stage" aria-label="Avatar humanoide animado"><div class="robot-stage"><div class="robot-wrap"><img class="robot-video" src="./robot-avatar.svg?v=20260918-36" alt="Humanoide futurista" decoding="async"><div class="robot-status" id="brainState">Pronto para conversar</div></div></div><canvas id="brainCanvas" aria-hidden="true"></canvas><div class="brain-aura"></div></section><section id="welcome" class="welcome"><h2>O que vamos fazer?</h2><p>Converse com o Vireonix. Escreva, fale ou use as ferramentas abaixo.</p><div class="quick-actions"><button data-prompt="Explique como você organiza uma tarefa complexa.">🧠 Explicar</button><button data-prompt="Pesquise e compare informações sobre inteligência artificial.">🔎 Pesquisar</button><button data-prompt="Ajude-me a criar um plano passo a passo para um projeto.">⚙️ Planejar</button><button data-prompt="Analise este problema e apresente as melhores alternativas.">📊 Analisar</button></div></section></main><footer class="composer-wrap"><div id="attachmentPreview" class="attachment-preview"><span id="attachmentInfo"></span><button id="removeAttachment" class="remove-attachment" aria-label="Remover anexo">×</button></div><div class="composer-tools" aria-label="Ferramentas"><button id="attachImage" class="tool-btn" title="Enviar imagem" aria-label="Enviar imagem">▧</butto
