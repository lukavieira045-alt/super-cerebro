<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#03040a">
  <title>Super Cérebro</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span></div>
        <div><h1>Super Cérebro</h1><span><i class="status-dot"></i> Vireonix conectado</span></div>
      </div>
      <button id="newChat" class="icon-button" title="Nova conversa" aria-label="Nova conversa">＋</button>
    </header>
    <main id="chat" class="chat" aria-live="polite">
      <section id="brainStage" class="brain-stage" aria-label="Cérebro cibernético interativo">
        <div class="cyber-brain" aria-hidden="true">
          <div class="brain-halo"></div>
          <div class="brain-shell">
            <div class="hemisphere left">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
            <div class="hemisphere right">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
            <div class="brain-fissure"></div>
            <div class="neural-line n1"></div><div class="neural-line n2"></div><div class="neural-line n3"></div><div class="neural-line n4"></div>
            <b class="node node1"></b><b class="node node2"></b><b class="node node3"></b><b class="node node4"></b><b class="node node5"></b><b class="node node6"></b>
            <div class="brain-stem"><span></span><span></span><span></span></div>
          </div>
          <div class="scan-ring ring1"></div><div class="scan-ring ring2"></div>
        </div>
        <canvas id="brainCanvas" aria-hidden="true"></canvas>
        <div class="brain-aura"></div>
        <div class="brain-state" id="brainState">Pronto para pensar</div>
      </section>
      <section id="welcome" class="welcome">
        <h2>Como posso ajudar?</h2>
        <p>Escreva ou fale. O cérebro reage enquanto pensa e responde.</p>
        <div class="quick-actions">
          <button data-prompt="Explique como você organiza uma tarefa complexa.">🧠 Explicar</button>
          <button data-prompt="Pesquise e compare informações sobre inteligência artificial.">🔎 Pesquisar</button>
          <button data-prompt="Ajude-me a criar um plano passo a passo para um projeto.">⚙️ Planejar</button>
          <button data-prompt="Faça um diagnóstico da sua capacidade local de ferramentas.">🩺 Diagnóstico</button>
        </div>
      </section>
    </main>
    <footer class="composer-wrap">
      <div class="composer">
        <button id="voice" class="voice-button" aria-label="Falar com o Super Cérebro" title="Falar">🎙</button>
        <textarea id="message" rows="1" maxlength="20000" placeholder="Mensagem para o Super Cérebro..." aria-label="Mensagem"></textarea>
        <button id="send" class="send-button" aria-label="Enviar">➤</button>
      </div>
      <div class="composer-meta"><span id="typing"></span><span>Vireonix • memória • ferramentas • pesquisa</span></div>
    </footer>
  </div>
  <script src="./app.js"></script>
</body>
</html>
