<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020308"><title>Super Cérebro • Vireonix</title><link rel="stylesheet" href="./style.css"><style>
/* Avatar vivo: sem moldura, com presença cinematográfica e reação ao estado do Vireonix */
.robot-stage{position:absolute;inset:0;overflow:hidden;display:grid;place-items:center;background:#020308}.robot-wrap{position:absolute;inset:-3%;width:106%;height:106%;display:grid;place-items:center;z-index:8;overflow:hidden;border:0;border-radius:0;background:transparent;box-shadow:none;isolation:isolate}.robot-img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;mix-blend-mode:screen;filter:saturate(1.1) contrast(1.08) brightness(.96);transform:scale(1.06);animation:robotLife 6s ease-in-out infinite;will-change:transform,filter}.robot-wrap:before{content:"";position:absolute;inset:-15%;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(80,180,255,.08),transparent 38%),radial-gradient(ellipse at 50% 75%,rgba(255,120,30,.10),transparent 28%);mix-blend-mode:screen;animation:energyPulse 3.8s ease-in-out infinite}.robot-wrap:after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(2,3,8,.16),transparent 24%,transparent 72%,rgba(2,3,8,.42)),radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.14) 68%,rgba(0,0,0,.55) 100%)}.robot-status{position:absolute;bottom:8%;z-index:25;padding:7px 14px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(2,5,10,.42);backdrop-filter:blur(12px);color:#eaf6ff;font-size:11px;box-shadow:0 8px 30px rgba(0,0,0,.3);transition:all .3s ease}.brain-stage.thinking .robot-img{animation:robotThink 1.15s ease-in-out infinite}.brain-stage.listening .robot-img{animation:robotListen .95s ease-in-out infinite}.brain-stage.speaking .robot-img{animation:robotSpeak .42s ease-in-out infinite}.brain-stage.thinking .robot-wrap:before{animation:energyThinking 1.2s ease-in-out infinite}.brain-stage.listening .robot-wrap:before{animation:energyListen .75s ease-in-out infinite}.brain-stage.speaking .robot-wrap:before{animation:energySpeak .38s ease-in-out infinite}.brain-stage.thinking .robot-status{border-color:rgba(120,160,255,.35);box-shadow:0 0 30px rgba(100,120,255,.18)}.brain-stage.listening .robot-status{border-color:rgba(40,220,255,.42);box-shadow:0 0 32px rgba(40,220,255,.2)}.brain-stage.speaking .robot-status{border-color:rgba(255,130,80,.4);box-shadow:0 0 35px rgba(255,100,50,.18)}@keyframes robotLife{0%,100%{transform:scale(1.06) translate3d(0,0,0) rotate(0deg)}25%{transform:scale(1.075) translate3d(-.35%,.25%,0) rotate(-.08deg)}50%{transform:scale(1.09) translate3d(.35%,-.45%,0) rotate(.08deg)}75%{transform:scale(1.075) translate3d(-.15%,-.15%,0) rotate(-.04deg)}}@keyframes robotThink{0%,100%{transform:scale(1.065) translateY(0) rotate(0)}50%{transform:scale(1.10) translateY(-.55%) rotate(.12deg)}}@keyframes robotListen{0%,100%{transform:scale(1.07) translateY(0)}50%{transform:scale(1.105) translateY(-.35%)}}@keyframes robotSpeak{0%,100%{transform:scale(1.075) translateY(0)}50%{transform:scale(1.105) translateY(-.28%)}}@keyframes energyPulse{0%,100%{opacity:.42;transform:scale(.96)}50%{opacity:.9;transform:scale(1.05)}}@keyframes energyThinking{0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:1;transform:scale(1.08)}}@keyframes energyListen{0%,100%{opacity:.35;transform:scale(.97)}50%{opacity:1;transform:scale(1.12)}}@keyframes energySpeak{0%,100%{opacity:.45;transform:scale(.97)}50%{opacity:1;transform:scale(1.1)}}@media(max-width:700px){.robot-wrap{inset:-7%;width:114%;height:114%}.robot-img{transform:scale(1.1)}.robot-status{bottom:9%;font-size:10px}}
</style></head><body><div class="app-shell"><header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true"><span>✦</span></div><div><h1>Super Cérebro</h1><span><i class="status-dot"></i> Vireonix conectado</span></div></div><div class="top-actions"><button id="memoryButton" class="icon-button" title="Memória — conversas salvas" aria-label="Abrir memória">▣</button><button id="voiceTest" class="icon-button" title="Testar voz masculina" aria-label="Testar voz masculina">🔊</button><button id="newChat" class="icon-button" title="Nova conversa" aria-label="Nova conversa">＋</button></div></header><aside id="memoryPanel" class="memory-panel" aria-label="Memória de conversas"><div class="memory-head"><div><strong>Memória</strong><span>Suas conversas salvas neste dispositivo</span></div><button id="memoryClose" class="icon-button" aria-label="Fechar memória">×</button></div><div id="memoryList" class="memory-list"></div></aside><div id="voiceStatus" class="voice-status"></div><main id="chat" class="chat" aria-live="polite"><section id="brainStage" class="brain-stage" aria-label="Avatar humanoide do Super Cérebro"><div class="robot-stage"><div class="robot-wrap"><img class="robot-img" src="https://i1.sndcdn.com/artworks-Y0cKgakz215wAGSX-XgzLsw-t500x500.jpg" alt="Humanoide futurista do Super Cérebro"><div class="robot-status" id="brainState">Pronto para conversar</div></div></div><canvas id="brainCanvas" aria-hidden="true"></canvas><div class="brain-aura"></div></section><section id="welcome" class="welcome"><h2>O que vamos fazer?</h2><p>Converse com o Vireonix. Escreva, fale ou use as ferramentas abaixo.</p><div class="quick-actions"><button data-prompt="Explique como você organiza uma tarefa complexa.">🧠 Explicar</button><button data-prompt="Pesquise e compare informações sobre inteligência artificial.">🔎 Pesquisar</button><button data-prompt="Ajude-me a criar um plano passo a passo para um projeto.">⚙️ Planejar</button><button data-prompt="Analise este problema e apresente as melhores alternativas.">📊 Analisar</button></div></section></main><footer class="composer-wrap"><div id="attachmentPreview" class="attachment-preview"><span id="attachmentInfo"></span><button id="removeAttachment" class="remove-attachment" aria-label="Remover anexo">×</button></div><div class="composer-tools" aria-label="Ferramentas"><button id="attachImage" class="tool-btn" title="Enviar imagem" aria-label="Enviar imagem">▧</button><button id="recordAudio" class="tool-btn" title="Gravar áudio" aria-label="Gravar áudio">●</button><button id="insertText" class="tool-btn" title="Focar texto" aria-label="Focar texto">T</button><button id="clearComposer" class="tool-btn" title="Limpar" aria-label="Limpar">⌫</button></div><input id="fileInput" type="file" accept="image/*"><div class="composer"><button id="voice" class="voice-button" aria-label="Falar com o Super Cérebro" title="Falar">🎙</button><textarea id="message" rows="1" maxlength="20000" placeholder="Converse com o Super Cérebro..." aria-label="Mensagem"></textarea><button id="send" class="send-button" aria-label="Enviar">➤</button></div><div class="composer-meta"><span id="typing"></span><span>Vireonix • memória • ferramentas • pesquisa</span></div></footer></div><script src="./cognitive.js?v=20260918-25"></script><script src="./app.js?v=20260918-25"></script><script src="./voice.js?v=20260918-25"></script><script src="./robot.js?v=20260918-25"></script><script>document.getElementById("memoryButton")?.addEventListener("click",()=>window.openMemory?.());document.getElementById("memoryClose")?.addEventListener("click",()=>document.getElementById("memoryPanel")?.classList.remove("open"));document.getElementById("voiceTest")?.addEventListener("click",()=>window.testMaleVoice?.());</script></body></html>
