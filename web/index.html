<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020308"><title>Super Cérebro • Vireonix</title><link rel="stylesheet" href="./style.css"><style>
.robot-stage{position:relative;width:100%;height:100%;display:grid;place-items:center}.robot-wrap{position:relative;width:min(92vw,760px);height:min(76vh,700px);display:grid;place-items:center;z-index:8;animation:robotFloat 5s ease-in-out infinite;filter:drop-shadow(0 0 28px rgba(34,211,238,.22)) drop-shadow(0 0 55px rgba(139,92,246,.16));will-change:transform,filter}.robot-img{width:100%;height:100%;object-fit:contain;object-position:center;user-select:none;-webkit-user-drag:none;mix-blend-mode:screen;filter:saturate(1.08) contrast(1.04) brightness(.98)}.robot-glow{position:absolute;width:72%;height:72%;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.16),rgba(139,92,246,.1) 42%,transparent 72%);filter:blur(30px);z-index:-1;animation:robotAura 3.4s ease-in-out infinite}.robot-grid{position:absolute;inset:8%;border:1px solid rgba(34,211,238,.08);border-radius:50%;animation:gridSpin 14s linear infinite;pointer-events:none}.robot-grid:after{content:"";position:absolute;inset:12%;border:1px dashed rgba(139,92,246,.1);border-radius:50%}.robot-status{position:absolute;bottom:7%;z-index:25;padding:7px 14px;border:1px solid rgba(34,211,238,.22);border-radius:999px;background:rgba(3,5,11,.78);backdrop-filter:blur(16px);color:#cfe7ff;font-size:11px;box-shadow:0 8px 25px rgba(0,0,0,.3)}.brain-stage.thinking .robot-wrap{animation:robotThink .62s ease-in-out infinite!important;filter:drop-shadow(0 0 38px rgba(139,92,246,.42)) drop-shadow(0 0 70px rgba(34,211,238,.2))}.brain-stage.listening .robot-wrap{animation:robotListen 1s ease-in-out infinite!important;filter:drop-shadow(0 0 42px rgba(34,211,238,.5))}.brain-stage.speaking .robot-wrap{animation:robotSpeak .2s ease-in-out infinite!important;filter:drop-shadow(0 0 48px rgba(244,114,182,.52))}.chat-mode .robot-wrap{width:min(84vw,600px);height:245px;opacity:.68;animation:robotChatFloat 4s ease-in-out infinite}.chat-mode .robot-status{bottom:16px}@keyframes robotFloat{0%,100%{transform:translate3d(0,0,0) scale(.98)}50%{transform:translate3d(0,-9px,0) scale(1.015)}}@keyframes robotChatFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px) scale(1.02)}}@keyframes robotThink{0%,100%{transform:scale(.99) translateY(0)}50%{transform:scale(1.045) translateY(-5px)}}@keyframes robotListen{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}@keyframes robotSpeak{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}@keyframes robotAura{0%,100%{transform:scale(.92);opacity:.45}50%{transform:scale(1.08);opacity:1}}@keyframes gridSpin{to{transform:rotate(360deg)}}@media(max-width:700px){.robot-wrap{width:120vw;height:68vh}.chat-mode .robot-wrap{width:112vw;height:205px}.robot-status{bottom:7%}}
</style></head><body><div class="app-shell"><header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true"><span>✦</span></div><div><h1>Super Cérebro</h1><span><i class="status-dot"></i> Vireonix conectado</span></div></div><div class="top-actions"><button id="memoryButton" class="icon-button" title="Memória — conversas salvas" aria-label="Abrir memória">▣</button><button id="voiceTest" class="icon-button" title="Testar voz masculina" aria-label="Testar voz masculina">🔊</button><button id="newChat" class="icon-button" title="Nova conversa" aria-label="Nova conversa">＋</button></div></header><aside id="memoryPanel" class="memory-panel" aria-label="Memória de conversas"><div class="memory-head"><div><strong>Memória</strong><span>Suas conversas salvas neste dispositivo</span></div><button id="memoryClose" class="icon-button" aria-label="Fechar memória">×</button></div><div id="memoryList" class="memory-list"></div></aside><div id="voiceStatus" class="voice-status"></div><main id="chat" class="chat" aria-live="polite"><section id="brainStage" class="brain-stage" aria-label="Avatar robótico do Super Cérebro"><div class="robot-stage" aria-hidden="true"><div class="robot-wrap"><div class="robot-glow"></div><div class="robot-grid"></div><img class="robot-img" src="https://wsrv.nl/?url=https%3A%2F%2Fpixnio.com%2Ffree-images%2F2025%2F04%2F08%2F2025-04-08-04-31-37-1344x1344.png&w=1344&q=90" alt="Robô humanoide futurista azul e branco"><div class="robot-status" id="brainState">Pronto para pensar</div></div></div><canvas id="brainCanvas" aria-hidden="true"></canvas><div class="brain-aura"></div></section><section id="welcome" class="welcome"><h2>O que vamos fazer?</h2><p>Converse com o Vireonix. Escreva, fale ou use as ferramentas abaixo.</p><div class="quick-actions"><button data-prompt="Explique como você organiza uma tarefa complexa.">🧠 Explicar</button><button data-prompt="Pesquise e compare informações sobre inteligência artificial.">🔎 Pesquisar</button><button data-prompt="Ajude-me a criar um plano passo a passo para um projeto.">⚙️ Planejar</button><button data-prompt="Analise este problema e apresente as melhores alternativas.">📊 Analisar</button></div></section></main><footer class="composer-wrap"><div id="attachmentPreview" class="attachment-preview"><span id="attachmentInfo"></span><button id="removeAttachment" class="remove-attachment" aria-label="Remover anexo">×</button></div><div class="composer-tools" aria-label="Ferramentas"><button id="attachImage" class="tool-btn" title="Enviar imagem" aria-label="Enviar imagem">▧</button><button id="recordAudio" class="tool-btn" title="Gravar áudio" aria-label="Gravar áudio">●</button><button id="insertText" class="tool-btn" title="Focar texto" aria-label="Focar texto">T</button><button id="clearComposer" class="tool-btn" title="Limpar" aria-label="Limpar">⌫</button></div><input id="fileInput" type="file" accept="image/*"><div class="composer"><button id="voice" class="voice-button" aria-label="Falar com o Super Cérebro" title="Falar">🎙</button><textarea id="message" rows="1" maxlength="20000" placeholder="Converse com o Super Cérebro..." aria-label="Mensagem"></textarea><button id="send" class="send-button" aria-label="Enviar">➤</button></div><div class="composer-meta"><span id="typing"></span><span>Vireonix • memória • ferramentas • pesquisa</span></div></footer></div><script src="./cognitive.js?v=20260917-17"></script><script src="./app.js?v=20260917-17"></script><script>
(()=>{const file=document.getElementById('fileInput'),attach=document.getElementById('attachImage'),preview=document.getElementById('attachmentPreview'),info=document.getElementById('attachmentInfo'),remove=document.getElementById('removeAttachment'),record=document.getElementById('recordAudio'),text=document.getElementById('insertText'),clear=document.getElementById('clearComposer'),msg=document.getElementById('message');let recorder=null,chunks=[];attach.onclick=()=>file.click();remove.onclick=()=>window.clearSelectedImage?.();text.onclick=()=>{msg.focus();msg.setSelectionRange(msg.value.length,msg.value.length)};clear.onclick=()=>{msg.value='';msg.style.height='48px';msg.focus()};record.onclick=async()=>{if(recorder&&recorder.state==='recording'){recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia){alert('Seu navegador não permite gravação de áudio.');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstart=()=>{record.classList.add('active');record.innerHTML='<span class="recording-dot"></span>';document.getElementById('brainStage').classList.add('listening')};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());record.classList.remove('active');record.textContent='●';const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});const url=URL.createObjectURL(blob);info.innerHTML='🎧 Áudio gravado <audio controls src="'+url+'"></audio>';preview.classList.add('show')};recorder.start()}catch(e){alert('Não foi possível acessar o microfone.')}}})();
</script><script>document.getElementById("memoryButton")?.addEventListener("click",()=>window.openMemory?.());document.getElementById("memoryClose")?.addEventListener("click",()=>document.getElementById("memoryPanel")?.classList.remove("open"));document.getElementById("voiceTest")?.addEventListener("click",()=>window.testMaleVoice?.());</script></body></html>
