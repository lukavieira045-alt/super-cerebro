<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020308"><title>Super Cérebro • Vireonix</title><link rel="stylesheet" href="./style.css"><style>.robot-stage{position:absolute;inset:0;overflow:hidden;display:grid;place-items:center;background:#020308}.robot-wrap{position:absolute;inset:-3%;width:106%;height:106%;display:grid;place-items:center;z-index:8;overflow:hidden;border:0;border-radius:0;background:transparent;box-shadow:none}.robot-img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}.robot-glow,.robot-grid{display:none}.robot-status{position:absolute;bottom:8%;z-index:25;padding:7px 14px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(2,5,10,.42);color:#eaf6ff;font-size:11px}</style></head><body><div class="app-shell"><header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true"><span>✦</span></div><div><h1>Super Cérebro</h1><span><i class="status-dot"></i> Vireonix conectado</span></div></div><div class="top-actions"><button id="memoryButton" class="icon-button" title="Memória — conversas salvas" aria-label="Abrir memória">▣</button><button id="voiceTest" class="icon-button" title="Testar voz masculina" aria-label="Testar voz masculina">🔊</button><button id="newChat" class="icon-button" title="Nova conversa" aria-label="Nova conversa">＋</button></div></header><aside id="memoryPanel" class="memory-panel" aria-label="Memória de conversas"><div class="memory-head"><div><strong>Memória</strong><span>Suas conversas salvas neste dispositivo</span></div><button id="memoryClose" class="icon-button" aria-label="Fechar memória">×</button></div><div id="memoryList" class="memory-list"></div></aside><div id="voiceStatus" class="voice-status"></div><main id="chat" class="chat" aria-live="polite"><section id="brainStage" class="brain-stage" aria-label="Avatar humanoide animado do Super Cérebro"><div class="robot-stage"><div class="robot-wrap"><img class="robot-img" src="https://media1.tenor.com/m/QFhK1odyJx0AAAAd/anyma-eva.gif" alt="Humanoide futurista animado"><div class="robot-status" id="brainState">Pronto para conversar</div></div></div><canvas id="brainCanvas" aria-hidden="true"></canvas><div class="brain-aura"></div></section><section id="welcome" class="welcome"><h2>O que vamos fazer?</h2><p>Converse com o Vireonix. Escreva, fale ou use as ferramentas abaixo.</p><div class="quick-actions"><button data-prompt="Explique como você organiza uma tarefa complexa.">🧠 Explicar</button><button data-prompt="Pesquise e compare informações sobre inteligência artificial.">🔎 Pesquisar</button><button data-prompt="Ajude-me a criar um plano passo a passo para um projeto.">⚙️ Planejar</button><button data-prompt="Analise este problema e apresente as melhores alternativas.">📊 Analisar</button></div></section></main><footer class="composer-wrap"><div id="attachmentPreview" class="attachment-preview"><span id="attachmentInfo"></span><button id="removeAttachment" class="remove-attachment" aria-label="Remover anexo">×</button></div><div class="composer-tools" aria-label="Ferramentas"><button id="attachImage" class="tool-btn" title="Enviar imagem" aria-label="Enviar imagem">▧</button><button id="recordAudio" class="tool-btn" title="Gravar áudio" aria-label="Gravar áudio">●</button><button id="insertText" class="tool-btn" title="Focar texto" aria-label="Focar texto">T</button><button id="clearComposer" class="tool-btn" title="Limpar" aria-label="Limpar">⌫</button></div><input id="fileInput" type="file" accept="image/*"><div class="composer"><button id="voice" class="voice-button" aria-label="Falar com o Super Cérebro" title="Falar">🎙</button><textarea id="message" rows="1" maxlength="20000" placeholder="Converse com o Super Cérebro..." aria-label="Mensagem"></textarea><button id="send" class="send-button" aria-label="Enviar">➤</button></div><div class="composer-meta"><span id="typing"></span><span>Vireonix • memória • ferramentas • pesquisa</span></div></footer></div><script src="./cognitive.js?v=20260918-26"></script><script src="./app.js?v=20260918-26"></script><script src="./voice.js?v=20260918-26"></script><script src="./robot.js?v=20260918-26"></script><script>document.getElementById("memoryButton")?.addEventListener("click",()=>window.openMemory?.());document.getElementById("memoryClose")?.addEventListener("click",()=>document.getElementById("memoryPanel")?.classList.remove("open"));document.getElementById("voiceTest")?.addEventListener("click",()=>window.testMaleVoice?.());</script></body></html>
